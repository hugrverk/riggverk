# Codex global config template.
# Review against your installed Codex version before applying.
#
# Codex 0.134+ removed the legacy top-level `profile = "..."` selector and
# `[profiles.*]` tables; profiles now live in separate `<name>.config.toml`
# overlays selected with `--profile`. The managed defaults are plain
# top-level keys plus app default approval-reviewer settings.
#
# `model` and `model_reasoning_effort` are create-only: they are written only
# when config.toml has no value for them. Afterwards they belong to the user
# and are never overwritten or flagged as drift.

model = "gpt-6.1-sol"
model_reasoning_effort = "xhigh"
approval_policy = "on-request"
approvals_reviewer = "user"
sandbox_mode = "workspace-write"

apps._default.approvals_reviewer = "user"
apps._default.default_tools_approval_mode = "prompt"

[mcp_servers]
# Optional MCP snippets live under templates/codex/mcp/.
