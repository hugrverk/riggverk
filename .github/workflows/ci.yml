name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # Pinned (matches local `rustc --version`) so new stable lints cannot turn
      # `clippy -D warnings` red without a code change. Bump deliberately.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # release-check runs the frontend tests, build, platform path helper tests,
      # Rust gates and every repository check exactly once.
      - name: Release check
        run: bash scripts/release-check.sh
