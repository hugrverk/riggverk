name: Windows checks

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: windows app and backend checks
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      # The version must match rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm test -- --run

      - name: Build frontend
        run: npm run build

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Rust clippy
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        env:
          RUST_TEST_THREADS: "1"
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
