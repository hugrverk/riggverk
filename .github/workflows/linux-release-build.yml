name: Linux release build

# Builds the Linux packages of a release in the Ubuntu 22.04 container of scripts/linux-build.sh, attests them and
# uploads them as the draft build candidate that `scripts/release.sh publish` takes. See docs/RELEASE.md.
#
# Started by hand, on the commit that will be released. It never runs for pull requests and it uses no cache, so
# nothing an earlier run or a fork left behind can reach the packages. It holds no secret: the updater key stays on
# the Mac, where publish signs the AppImage.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: linux-release-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The build runs npm and cargo build scripts, so this job may only read the repository.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build, name and stamp the packages
        run: bash scripts/release.sh build-linux --ci "$RUNNER_TEMP/linux"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: ${{ runner.temp }}/linux
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  # Checks out and runs nothing from the repository: it attests what the build job made and uploads it. The
  # attestation ties each package to this workflow and this commit; publish verifies both before it takes them.
  candidate:
    name: attest and upload
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # The draft release that holds the candidate.
      contents: write
      # The short-lived signing certificate of the attestation.
      id-token: write
      attestations: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-packages
          path: linux

      - name: Check the stamp against this run
        id: stamp
        working-directory: linux
        run: |
          set -euo pipefail
          version="$(jq -er '.version' linux-build.json)"
          if ! [[ "$version" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+$ ]]; then
            echo "unexpected version in the stamp: $version" >&2
            exit 1
          fi
          if [ "$(jq -er '.commit' linux-build.json)" != "$GITHUB_SHA" ]; then
            echo "the stamp is not of $GITHUB_SHA" >&2
            exit 1
          fi
          expected="$(printf '%s\n' "Riggverk-v$version-linux-amd64.deb" "Riggverk-v$version-linux-x86_64.AppImage" \
            "Riggverk-v$version-linux-x86_64.rpm" linux-build.json | LC_ALL=C sort)"
          if [ "$(ls -A | LC_ALL=C sort)" != "$expected" ]; then
            echo "unexpected files from the build job:" >&2
            ls -A >&2
            exit 1
          fi
          [ "$(jq -r '.files | length' linux-build.json)" = 3 ]
          jq -r '.files | to_entries[] | "\(.value)  \(.key)"' linux-build.json | sha256sum --check --strict
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            linux/*.AppImage
            linux/*.deb
            linux/*.rpm

      # A draft has no tag, is seen only by people with write access and is never the latest release. A rebuild of
      # the version replaces it.
      - name: Upload the build candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.stamp.outputs.version }}
        run: |
          set -euo pipefail
          tag="linux-candidate-v$VERSION"
          if output="$(gh release view "$tag" 2>&1)"; then
            gh release delete "$tag" --yes
          elif [[ "$output" != *"release not found"* ]]; then
            echo "cannot check for an earlier $tag: $output" >&2
            exit 1
          fi
          gh release create "$tag" linux/* --draft --prerelease --target "$GITHUB_SHA" \
            --title "Linux build candidate $VERSION" \
            --notes "Linux packages of $GITHUB_SHA for scripts/release.sh publish, built and attested by run $GITHUB_RUN_ID. Not a release."
