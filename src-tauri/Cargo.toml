[package]
name = "riggverk"
version = "2026.10.2"
description = "Local macOS GUI for Riggverk"
authors = []
edition = "2021"

[lib]
name = "riggverk_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
sha2 = "0.10"

[profile.release]
strip = true
lto = "thin"
